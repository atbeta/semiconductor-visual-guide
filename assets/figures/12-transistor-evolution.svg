<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Planar, FinFET and GAA gate wrap comparison">
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="4 6" opacity=".45">
    <line x1="253" y1="30" x2="253" y2="300"/>
    <line x1="506" y1="30" x2="506" y2="300"/>
  </g>

  <!-- 1 平面：栅极只接触上表面 -->
  <g>
    <rect x="55" y="200" width="185" height="76" rx="2" fill="#94a3b8"/>
    <rect x="78" y="200" width="42" height="26" fill="#38bdf8"/>
    <rect x="175" y="200" width="42" height="26" fill="#38bdf8"/>
    <rect x="120" y="200" width="55" height="10" fill="#22d3ee"/>
    <rect x="120" y="166" width="55" height="34" rx="3" fill="#f59e0b"/>
    <line x1="120" y1="200" x2="175" y2="200" stroke="#fde68a" stroke-width="3.5"/>
    <text x="147" y="308" font-family="ui-monospace,Menlo,monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#f59e0b">1</text>
  </g>

  <!-- 2 FinFET：栅极三面包覆 -->
  <g>
    <rect x="305" y="228" width="195" height="48" rx="2" fill="#94a3b8"/>
    <rect x="360" y="150" width="80" height="78" fill="#38bdf8"/>
    <rect x="360" y="150" width="80" height="8" fill="#22d3ee"/>
    <path d="M338,150 L338,228 L462,228 L462,150 Z M360,168 L360,220 L440,220 L440,168 Z"
          fill="#f59e0b" fill-rule="evenodd" stroke="#b45309" stroke-width="1.5"/>
    <text x="400" y="308" font-family="ui-monospace,Menlo,monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#f59e0b">3</text>
  </g>

  <!-- 3 GAA：栅极四面环绕 -->
  <g>
    <rect x="555" y="228" width="195" height="48" rx="2" fill="#94a3b8"/>
    <!-- 栅极金属块（剖面里填满片与片之间） -->
    <rect x="588" y="118" width="140" height="132" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- 纳米片 -->
    <g fill="#38bdf8">
      <rect x="602" y="132" width="112" height="18" rx="2"/>
      <rect x="602" y="176" width="112" height="18" rx="2"/>
      <rect x="602" y="220" width="112" height="18" rx="2"/>
    </g>
    <text x="658" y="308" font-family="ui-monospace,Menlo,monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#f59e0b">4</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Bathtub curve with three numbered regions">
  <!-- 坐标轴 -->
  <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <line x1="86" y1="272" x2="660" y2="272"/>
    <line x1="86" y1="272" x2="86" y2="48"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" opacity=".7">
    <path d="M660,272 l-9,-5 M660,272 l-9,5" fill="none"/>
    <path d="M86,48 l-5,9 M86,48 l5,9" fill="none"/>
  </g>

  <!-- 三个区间底色 -->
  <rect x="86" y="48" width="180" height="224" fill="#ef4444" opacity=".07"/>
  <rect x="266" y="48" width="234" height="224" fill="#22c55e" opacity=".07"/>
  <rect x="500" y="48" width="160" height="224" fill="#f59e0b" opacity=".07"/>

  <!-- 曲线 -->
  <path d="M92,80 C120,180 160,232 210,236 C270,241 330,238 400,236 C470,234 520,232 560,222 C604,211 632,170 652,96"
        fill="none" stroke="#94a3b8" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M92,80 C120,180 160,232 210,236 C270,241 330,238 400,236 C470,234 520,232 560,222 C604,211 632,170 652,96 L652,272 L92,272 Z"
        fill="#94a3b8" opacity=".06"/>

  <!-- 编号 -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="150" cy="110" r="17" fill="#ef4444"/><text x="150" y="116" fill="#fff">1</text>
    <circle cx="383" cy="110" r="17" fill="#22c55e"/><text x="383" y="116" fill="#fff">2</text>
    <circle cx="590" cy="110" r="17" fill="#f59e0b"/><text x="590" y="116" fill="#1a1a1a">3</text>
  </g>

  <!-- 老化筛选的切割线 -->
  <g stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6 5">
    <line x1="266" y1="48" x2="266" y2="272"/>
  </g>
  <path d="M266,48 l10,-8 M266,48 l-10,-8" stroke="#38bdf8" stroke-width="1.6" fill="none"/>

  <!-- 分界刻度 -->
  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="266" y1="272" x2="266" y2="280"/>
    <line x1="500" y1="272" x2="500" y2="280"/>
  </g>
</svg>

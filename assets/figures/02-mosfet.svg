<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="MOSFET cross-section with numbered parts">
  <!-- 引脚 -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <line x1="205" y1="228" x2="205" y2="122"/>
    <line x1="435" y1="228" x2="435" y2="122"/>
    <line x1="320" y1="176" x2="320" y2="104"/>
  </g>
  <g fill="#64748b">
    <circle cx="205" cy="122" r="6"/><circle cx="435" cy="122" r="6"/><circle cx="320" cy="104" r="6"/>
  </g>

  <!-- 硅基底 -->
  <rect x="90" y="228" width="460" height="112" rx="3" fill="#94a3b8"/>
  <rect x="90" y="228" width="460" height="112" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- 源 / 漏 n+ -->
  <rect x="130" y="228" width="90" height="46" fill="#38bdf8"/>
  <rect x="420" y="228" width="90" height="46" fill="#38bdf8"/>

  <!-- 沟道 -->
  <rect x="220" y="228" width="200" height="18" fill="#22d3ee" opacity=".55"/>
  <rect x="220" y="228" width="200" height="18" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 栅极氧化层 -->
  <rect x="220" y="218" width="200" height="10" fill="#22d3ee"/>
  <rect x="220" y="218" width="200" height="10" fill="none" stroke="#0e7490" stroke-width="1.2"/>

  <!-- 栅极 -->
  <rect x="240" y="176" width="160" height="42" rx="4" fill="#f59e0b"/>
  <rect x="240" y="176" width="160" height="42" rx="4" fill="none" stroke="#b45309" stroke-width="1.5"/>

  <!-- 编号 -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="205" cy="86" r="16" fill="#f59e0b"/><text x="205" y="92" fill="#1a1a1a">1</text>
    <circle cx="435" cy="86" r="16" fill="#f59e0b"/><text x="435" y="92" fill="#1a1a1a">2</text>
    <circle cx="320" cy="70" r="16" fill="#f59e0b"/><text x="320" y="76" fill="#1a1a1a">3</text>
    <circle cx="470" cy="223" r="16" fill="#f59e0b"/><text x="470" y="229" fill="#1a1a1a">4</text>
    <circle cx="320" cy="270" r="16" fill="#f59e0b"/><text x="320" y="276" fill="#1a1a1a">5</text>
  </g>

  <!-- 沟道长度标注 -->
  <g stroke="#8b93a7" stroke-width="1.4">
    <line x1="222" y1="330" x2="418" y2="330" stroke-dasharray="4 3"/>
    <line x1="222" y1="322" x2="222" y2="338"/>
    <line x1="418" y1="322" x2="418" y2="338"/>
  </g>
</svg>
